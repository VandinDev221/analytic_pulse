# Render Blueprint — API + Frontend (monorepo)
# https://render.com/docs/blueprint-spec
#
# Postgres NÃO é criado aqui (limite: 1 banco free por workspace no Render).
# No sync, informe DATABASE_URL do Postgres existente ou use Neon (grátis).
#
# Após o deploy:
# 1. Execute database/schema.sql no seu Postgres
# 2. Configure pings em https://cron-job.org (ver README)

services:
  # ── API Express ─────────────────────────────────────────────────────────────
  - type: web
    name: analytic-pulse-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start -w @analytic-pulse/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://analytic-pulse.vercel.app
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  # Nota: O Frontend SPA (analytic-pulse-web) foi removido daqui e migrado para a Vercel
  # para evitar o consumo duplo de instâncias gratuitas no Render (estouro do limite de 750h).
